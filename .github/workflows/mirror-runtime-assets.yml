name: Mirror runtime assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirror-runtime-assets.yml'

permissions:
  contents: write

jobs:
  mirror-assets:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: NeeyuBL/neeyut-blao
      TARGET_REPO: vinhhbui/video-download
      ASSET_TAG: assets-v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create target release if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$ASSET_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create "$ASSET_TAG" \
              --repo "$TARGET_REPO" \
              --title "Mivio runtime assets v1" \
              --notes "Pinned runtime dependencies used by Mivio. Mirrored from the legacy NeeyuBL/neeyut-blao assets-v1 release so the app no longer depends on the old repository." \
              --prerelease
          fi

      - name: Discover source assets
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mirror
          gh api "repos/$SOURCE_REPO/releases/tags/$ASSET_TAG" \
            --jq '.assets[] | [.name, .browser_download_url] | @tsv' > assets.tsv
          if [ ! -s assets.tsv ]; then
            echo "No assets found in $SOURCE_REPO release $ASSET_TAG" >&2
            exit 1
          fi
          echo "Assets to mirror:"
          cut -f1 assets.tsv

      - name: Download source assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name url; do
            echo "Downloading $name"
            curl --fail --location --retry 3 --retry-delay 2 \
              --output "mirror/$name" "$url"
          done < assets.tsv

      - name: Upload assets to Mivio release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$ASSET_TAG" mirror/* \
            --repo "$TARGET_REPO" \
            --clobber

      - name: Verify mirrored asset names
        shell: bash
        run: |
          set -euo pipefail
          sort <(cut -f1 assets.tsv) > source-assets.txt
          gh api "repos/$TARGET_REPO/releases/tags/$ASSET_TAG" \
            --jq '.assets[].name' | sort > target-assets.txt
          missing="$(comm -23 source-assets.txt target-assets.txt || true)"
          if [ -n "$missing" ]; then
            echo "Missing mirrored assets:" >&2
            echo "$missing" >&2
            exit 1
          fi
          echo "All source assets are available in $TARGET_REPO@$ASSET_TAG"

      - name: Switch app to Mivio asset release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main/deps.ts')
          text = path.read_text(encoding='utf-8')
          old = 'https://github.com/NeeyuBL/neeyut-blao/releases/download/${ASSET_TAG}'
          new = 'https://github.com/vinhhbui/video-download/releases/download/${ASSET_TAG}'
          text = text.replace(old, new)
          text = text.replace(
              'Host tren release rieng (github NeeyuBL/neeyut-blao)',
              'Host tren release rieng cua Mivio (github vinhhbui/video-download)'
          )
          path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet -- src/main/deps.ts; then
            echo "Asset source is already using $TARGET_REPO"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/deps.ts
          git commit -m "fix: move runtime assets to video-download release"
          git push origin HEAD:main
